[build]
  publish = "."
  functions = "netlify/functions"

# Qidiruv tizimlari indekslamasin — havola faqat siz bergan odamlarda qolsin
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Rasmlar o'zgarmaydi — brauzer keshlab tursin
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Video ham o'zgarmaydi — brauzer keshlab tursin
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
